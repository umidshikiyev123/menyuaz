<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MenyuAZ</title>
  <style>
    :root {
      --dark: #1d1a17;
      --paper: #f7f1e8;
      --card: #fffdf9;
      --ink: #2a2520;
      --muted: #7a6f64;
      --accent: #b5452f;
      --line: #e2d8c8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: "Georgia", "Times New Roman", serif;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.5;
    }

    /* ===== Hero ===== */
    .hero {
      position: relative;
      min-height: 62vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
      overflow: hidden;
      background: var(--dark);
    }
    .slide {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1.6s ease-in-out;
    }
    .slide.active { opacity: 1; }
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(20,16,12,0.45), rgba(20,16,12,0.8));
      z-index: 1;
    }
    .hero-content { position: relative; z-index: 2; padding: 20px; }
    .hero h1 {
      font-size: clamp(2.4rem, 6vw, 4.2rem);
      letter-spacing: 1px;
      font-weight: normal;
    }
    .hero p {
      margin-top: 10px;
      font-size: 1.1rem;
      opacity: 0.85;
      font-style: italic;
    }
    .hero .scroll-hint {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.8rem;
      opacity: 0.6;
      letter-spacing: 2px;
      z-index: 2;
    }

    /* ===== Ana kart ===== */
    .menu-wrap {
      max-width: 900px;
      margin: -70px auto 0;
      padding: 0 24px 50px;
      position: relative;
      z-index: 3;
    }
    .menu-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 48px 36px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.12);
      text-align: center;
    }
    .lang-switch {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 28px;
    }
    .lang-switch button {
      background: none;
      border: 1px solid var(--line);
      color: var(--muted);
      padding: 4px 12px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.8rem;
      border-radius: 4px;
    }
    .lang-switch button.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .placeholder h2 {
      font-size: 1.6rem;
      font-weight: normal;
      margin-bottom: 10px;
    }
    .placeholder p {
      color: var(--muted);
      margin-bottom: 26px;
    }
    .make-btn {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      padding: 16px 40px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 1.1rem;
      letter-spacing: 1px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.18);
      transition: transform 0.2s, opacity 0.2s;
    }
    .make-btn:hover { transform: translateY(-2px); opacity: 0.95; }

    /* ===== Üstünlüklər ===== */
    .cta {
      max-width: 900px;
      margin: 0 auto;
      padding: 50px 24px 30px;
      text-align: center;
    }
    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 26px;
      text-align: left;
    }
    .feature {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px;
    }
    .feature strong {
      display: block;
      margin-bottom: 4px;
      font-weight: normal;
    }
    .feature span { font-size: 0.9rem; color: var(--muted); }
    .contact-link {
      display: inline-block;
      color: var(--accent);
      font-size: 0.95rem;
      text-decoration: none;
      border-bottom: 1px solid var(--accent);
      padding-bottom: 2px;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 30px 16px 40px;
    }

    /* ===== Aşağıdan yuxarı görünmə ===== */
    .reveal {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

<section class="hero" id="hero">
  <div class="slide active" style="background-image:url('images/bg1.avif')"></div>
  <div class="slide" style="background-image:url('images/bg2.avif')"></div>
  <div class="slide" style="background-image:url('images/bg3.avif')"></div>
  <div class="slide" style="background-image:url('images/bg4.avif')"></div>
  <div class="slide" style="background-image:url('images/bg5.avif')"></div>
  <div class="hero-content">
    <h1 id="shopName">MenyuAZ</h1>
    <p id="tagline"></p>
  </div>
  <span class="scroll-hint">AŞAĞI</span>
</section>

<div class="menu-wrap">
  <div class="menu-card reveal">
    <div class="lang-switch">
      <button data-lang="az" class="active">AZ</button>
      <button data-lang="en">EN</button>
    </div>
    <div class="placeholder">
      <h2 id="phTitle"></h2>
      <p id="phText"></p>
      <a class="make-btn" id="makeBtn" href="builder.html"></a>
    </div>
  </div>
</div>

<section class="cta reveal" id="cta">
  <div class="features">
    <div class="feature"><strong id="f1t"></strong><span id="f1s"></span></div>
    <div class="feature"><strong id="f2t"></strong><span id="f2s"></span></div>
    <div class="feature"><strong id="f3t"></strong><span id="f3s"></span></div>
    <div class="feature"><strong id="f4t"></strong><span id="f4s"></span></div>
  </div>
  <a class="contact-link" id="ctaBtn" href="https://wa.me/994991295237" target="_blank" rel="noopener"></a>
</section>

<footer id="footer"></footer>

<script>
  // ===== MƏLUMATLAR: yalnız bu hissəni dəyişin =====

  // Əlaqə nömrəsi: 994 ilə başlayan nömrənizi yazın (boşluqsuz)
  const whatsappNumber = "994991295237";

  const shop = {
    name: { az: "MenyuAZ", en: "MenyuAZ" },
    tagline: { az: "", en: "" },
    footer: { az: "Qiymətlər AZN ilə göstərilir", en: "Prices in AZN" },
    placeholder: {
      title: { az: "Menyunuz burada görünəcək", en: "Your menu will appear here" },
      text: {
        az: "Kafe və ya restoranınız üçün QR menyu saytını bir neçə dəqiqəyə yaradın.",
        en: "Create your cafe or restaurant QR menu site in a few minutes."
      },
      button: { az: "Menyunuzu indi yaradın", en: "Create your menu now" }
    },
    features: [
      { t: { az: "Hazır şablon", en: "Ready template" }, s: { az: "Sadə, real görünən dizaynla başlayın.", en: "Start with a simple, real-looking design." } },
      { t: { az: "Öz məhsullarınız", en: "Your own items" }, s: { az: "Menyunu özünüz doldurun və yeniləyin.", en: "Fill in and update the menu yourself." } },
      { t: { az: "QR kod", en: "QR code" }, s: { az: "Masalara qoyulan QR kodla menyu açılır.", en: "A QR code on the table opens the menu." } },
      { t: { az: "Ayrıca domen", en: "Own domain" }, s: { az: "Sayt üçün öz linkinizi əldə edin.", en: "Get your own link for the site." } }
    ],
    contact: { az: "Əlaqə saxla", en: "Contact us" }
  };

  let currentLang = "az";

  function t(obj) {
    return obj[currentLang] || obj.az;
  }

  function render() {
    document.getElementById("shopName").textContent = t(shop.name);
    document.getElementById("tagline").textContent = t(shop.tagline);
    document.getElementById("footer").textContent = t(shop.footer);
    document.getElementById("phTitle").textContent = t(shop.placeholder.title);
    document.getElementById("phText").textContent = t(shop.placeholder.text);
    document.getElementById("makeBtn").textContent = t(shop.placeholder.button);
    shop.features.forEach((f, i) => {
      document.getElementById("f" + (i + 1) + "t").textContent = t(f.t);
      document.getElementById("f" + (i + 1) + "s").textContent = t(f.s);
    });
    document.getElementById("ctaBtn").textContent = t(shop.contact);
    document.getElementById("ctaBtn").href = "https://wa.me/" + whatsappNumber;
    document.title = "MenyuAZ";
    document.documentElement.lang = currentLang;

    document.querySelectorAll(".lang-switch button").forEach(b => {
      b.classList.toggle("active", b.dataset.lang === currentLang);
    });
  }

  document.querySelectorAll(".lang-switch button").forEach(btn => {
    btn.addEventListener("click", () => {
      currentLang = btn.dataset.lang;
      render();
    });
  });

  // Hero şəkillərinin fade ilə dəyişməsi (hər 5 saniyə)
  const slides = document.querySelectorAll(".slide");
  let slideIndex = 0;
  setInterval(() => {
    slides[slideIndex].classList.remove("active");
    slideIndex = (slideIndex + 1) % slides.length;
    slides[slideIndex].classList.add("active");
  }, 5000);

  // Aşağı sürüşdükcə elementlər yuxarıya doğru görünür
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add("visible");
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12 });

  document.querySelectorAll(".reveal").forEach(el => observer.observe(el));

  render();
</script>
</body>
</html>
